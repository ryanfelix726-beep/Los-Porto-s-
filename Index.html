<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Los Port's Customs — Agenda</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Oswald:wght@400;500;600;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0c0c0d;
    --bg-elevated:#17171a;
    --bg-card:#1e1e21;
    --bg-card-hover:#252528;
    --line:rgba(255,255,255,0.09);
    --line-strong:rgba(255,255,255,0.16);
    --text:#f2efe9;
    --text-dim:#9a978f;
    --text-faint:#6b6963;
    --brass:#c7a463;
    --brass-bright:#e0bd7f;
    --brass-dim:#7a6440;
    --pinstripe:#a4342a;
    --steel:#4c5b66;
    --radius:14px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{background:var(--bg); color:var(--text); font-family:'Work Sans', sans-serif; -webkit-font-smoothing:antialiased;}
  body{
    background-image:
      radial-gradient(circle at 50% -10%, rgba(199,164,99,0.07), transparent 55%),
      repeating-linear-gradient(135deg, rgba(255,255,255,0.012) 0px, rgba(255,255,255,0.012) 1px, transparent 1px, transparent 8px);
    min-height:100vh;
  }
  button, input, select{ font-family:inherit; }
  button{ cursor:pointer; border:none; background:none; color:inherit; }
  input, select{ color:var(--text); }
  a{ color:inherit; }
  ::selection{ background:var(--brass); color:#141414; }
  :focus-visible{ outline:2px solid var(--brass); outline-offset:2px; border-radius:4px; }

  .shell{ max-width:520px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column; padding:0 0 40px; }

  /* ---------- HEADER / BADGE ---------- */
  .badge-header{ padding:36px 24px 26px; text-align:center; position:relative; }
  .eagle{ width:46px; height:46px; margin:0 auto 6px; opacity:0.92; }
  .eagle path{ fill:none; stroke:var(--text); stroke-width:1.4; stroke-linecap:round; stroke-linejoin:round; }
  .brand-script{ font-family:'Pinyon Script', cursive; font-size:44px; line-height:1; color:var(--brass-bright); margin-top:2px; }
  .brand-block{ font-family:'Oswald', sans-serif; font-weight:700; font-size:33px; letter-spacing:5px; margin-top:2px; }
  .brand-tagline{ font-family:'Oswald', sans-serif; font-weight:500; font-size:10.5px; letter-spacing:4px; color:var(--text-dim); margin-top:8px; text-transform:uppercase; }
  .brand-divider{ display:flex; align-items:center; justify-content:center; gap:10px; margin-top:14px; color:var(--text-faint); }
  .brand-divider .ln{ width:52px; height:1px; background:var(--line-strong); }
  .brand-divider .star{ font-size:11px; color:var(--brass); }
  .status-row{ margin-top:16px; display:inline-flex; align-items:center; gap:7px; font-size:12px; color:var(--text-dim); }
  .status-dot{ width:7px; height:7px; border-radius:50%; background:var(--text-faint); }
  .status-dot.open{ background:var(--brass); box-shadow:0 0 8px var(--brass); }

  /* ---------- STEPPER ---------- */
  .stepper{ display:flex; padding:0 20px; gap:6px; margin-bottom:22px; }
  .step-tab{ flex:1; text-align:center; padding:9px 2px; font-family:'Oswald', sans-serif; font-size:10.5px; letter-spacing:1.2px; color:var(--text-faint); border-bottom:2px solid var(--line); text-transform:uppercase; transition:color .2s, border-color .2s; }
  .step-tab.active{ color:var(--brass-bright); border-color:var(--brass); }
  .step-tab.done{ color:var(--text-dim); border-color:var(--line-strong); }

  .content{ padding:0 20px; flex:1; }
  .back-link{ display:inline-flex; align-items:center; gap:5px; font-size:12.5px; color:var(--text-dim); margin-bottom:16px; }
  .back-link:hover{ color:var(--text); }
  .section-title{ font-family:'Oswald', sans-serif; font-weight:600; font-size:19px; letter-spacing:0.3px; margin-bottom:4px; }
  .section-sub{ font-size:13px; color:var(--text-dim); margin-bottom:18px; }

  /* ---------- VEHICLE TOGGLE ---------- */
  .veh-toggle{ display:flex; background:var(--bg-card); border:1px solid var(--line); border-radius:100px; padding:4px; margin-bottom:18px; }
  .veh-toggle button{ flex:1; padding:9px 0; font-family:'Oswald', sans-serif; font-size:12.5px; letter-spacing:1px; text-transform:uppercase; color:var(--text-dim); border-radius:100px; transition:all .2s; }
  .veh-toggle button.active{ background:var(--brass); color:#161310; font-weight:600; }

  /* ---------- SERVICE CARDS ---------- */
  .service-card{ position:relative; background:var(--bg-card); border:1px solid var(--line); border-radius:var(--radius); padding:16px 18px; margin-bottom:11px; display:flex; justify-content:space-between; align-items:center; gap:12px; transition:border-color .15s, background .15s; }
  .service-card:hover{ border-color:var(--line-strong); background:var(--bg-card-hover); }
  .service-card.highlight{ border-color:var(--brass-dim); background:linear-gradient(135deg, rgba(199,164,99,0.09), var(--bg-card)); }
  .service-name-row{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .service-name{ font-family:'Oswald', sans-serif; font-weight:600; font-size:15.5px; }
  .service-badge{ font-size:9px; letter-spacing:1px; text-transform:uppercase; color:#161310; background:var(--brass); padding:2px 7px; border-radius:100px; font-weight:600; }
  .service-meta{ font-size:12px; color:var(--text-dim); margin-top:4px; }
  .service-price{ font-family:'Oswald', sans-serif; font-weight:600; font-size:17px; color:var(--brass-bright); white-space:nowrap; }
  .empty-note{ font-size:13px; color:var(--text-faint); padding:20px 0; text-align:center; }

  /* ---------- DATE STRIP ---------- */
  .date-strip{ display:flex; gap:8px; overflow-x:auto; padding-bottom:8px; margin-bottom:6px; -webkit-overflow-scrolling:touch; }
  .date-strip::-webkit-scrollbar{ height:4px; }
  .date-strip::-webkit-scrollbar-thumb{ background:var(--line-strong); border-radius:4px; }
  .date-chip{ flex:0 0 auto; width:58px; padding:12px 0 10px; text-align:center; background:var(--bg-card); border:1px solid var(--line); border-radius:12px; }
  .date-chip .dow{ font-size:10px; letter-spacing:0.5px; color:var(--text-faint); text-transform:uppercase; }
  .date-chip .num{ font-family:'Oswald', sans-serif; font-weight:600; font-size:19px; margin-top:3px; }
  .date-chip .mon{ font-size:9.5px; color:var(--text-faint); margin-top:1px; text-transform:uppercase; }
  .date-chip.active{ background:var(--brass); border-color:var(--brass); }
  .date-chip.active .dow, .date-chip.active .num, .date-chip.active .mon{ color:#161310; }
  .date-chip.closed{ opacity:0.35; }
  .date-chip.closed .num{ text-decoration:line-through; }

  /* ---------- TIME GRID ---------- */
  .time-grid{ display:grid; grid-template-columns:repeat(3, 1fr); gap:9px; margin-top:16px; }
  .time-chip{ padding:11px 0; text-align:center; background:var(--bg-card); border:1px solid var(--line); border-radius:10px; font-family:'Oswald', sans-serif; font-size:14px; letter-spacing:0.5px; }
  .time-chip.active{ background:var(--brass); border-color:var(--brass); color:#161310; font-weight:600; }

  /* ---------- FORM ---------- */
  .summary-box{ background:var(--bg-card); border:1px solid var(--line); border-radius:var(--radius); padding:16px 18px; margin-bottom:20px; }
  .summary-row{ display:flex; justify-content:space-between; font-size:13px; padding:5px 0; }
  .summary-row .k{ color:var(--text-dim); }
  .summary-row .v{ font-weight:500; text-align:right; }
  .summary-row.total .v{ color:var(--brass-bright); font-family:'Oswald', sans-serif; font-weight:600; font-size:15px; }
  .field{ margin-bottom:14px; }
  .field label{ display:block; font-size:11.5px; letter-spacing:0.6px; text-transform:uppercase; color:var(--text-dim); margin-bottom:7px; }
  .field input{ width:100%; background:var(--bg-card); border:1px solid var(--line); border-radius:10px; padding:12px 14px; font-size:14.5px; }
  .field input:focus{ border-color:var(--brass-dim); }

  .btn-primary{ width:100%; background:var(--brass); color:#161310; font-family:'Oswald', sans-serif; font-weight:600; font-size:14px; letter-spacing:1px; text-transform:uppercase; padding:15px 0; border-radius:11px; margin-top:6px; transition:background .15s; }
  .btn-primary:hover{ background:var(--brass-bright); }
  .btn-primary:disabled{ background:var(--bg-card); color:var(--text-faint); cursor:not-allowed; }
  .btn-ghost{ width:100%; border:1px solid var(--line-strong); color:var(--text); font-family:'Oswald', sans-serif; font-weight:500; font-size:13px; letter-spacing:0.8px; padding:13px 0; border-radius:11px; margin-top:10px; }

  /* ---------- TICKET ---------- */
  .ticket-wrap{ padding:8px 4px 0; }
  .ticket{ position:relative; background:var(--bg-card); border:1px solid var(--line-strong); border-radius:16px; padding:26px 22px 22px; }
  .ticket:before, .ticket:after{ content:""; position:absolute; left:50%; transform:translateX(-50%); width:26px; height:13px; background:var(--bg); border-radius:0 0 20px 20px; }
  .ticket:before{ top:-1px; }
  .ticket:after{ bottom:-1px; border-radius:20px 20px 0 0; }
  .ticket-dash{ border-top:1.5px dashed var(--line-strong); margin:16px 0; }
  .ticket-top{ text-align:center; }
  .ticket-code{ font-family:'Oswald', sans-serif; letter-spacing:3px; font-size:12px; color:var(--text-dim); }
  .ticket-service{ font-family:'Oswald', sans-serif; font-weight:600; font-size:20px; margin-top:6px; }
  .stamp{ position:absolute; top:22px; right:18px; border:2px solid var(--pinstripe); color:var(--pinstripe); font-family:'Oswald', sans-serif; font-weight:700; font-size:10.5px; letter-spacing:1.5px; padding:5px 9px; border-radius:6px; transform:rotate(9deg); opacity:0.9; }
  .ticket-row{ display:flex; justify-content:space-between; font-size:13px; padding:6px 0; }
  .ticket-row .k{ color:var(--text-dim); }
  .ticket-row .v{ font-weight:500; }
  .ticket-price{ text-align:center; margin-top:6px; }
  .ticket-price .amt{ font-family:'Oswald', sans-serif; font-weight:700; font-size:28px; color:var(--brass-bright); }
  .ticket-note{ text-align:center; font-size:11.5px; color:var(--text-faint); margin-top:14px; line-height:1.5; }

  /* ---------- FOOTER ---------- */
  .foot{ text-align:center; padding:34px 20px 0; }
  .foot .ig{ font-size:12px; color:var(--text-dim); }
  .foot .admin-link{ display:inline-block; margin-top:14px; font-size:11px; color:var(--text-faint); letter-spacing:0.5px; border-bottom:1px dotted var(--text-faint); }

  /* ---------- ADMIN ---------- */
  .admin-shell{ padding:28px 20px 60px; }
  .admin-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:22px; }
  .admin-head h1{ font-family:'Oswald', sans-serif; font-size:18px; font-weight:600; letter-spacing:0.5px; }
  .admin-exit{ font-size:12px; color:var(--text-dim); }
  .pin-box{ max-width:280px; margin:60px auto 0; text-align:center; }
  .pin-box input{ width:100%; text-align:center; letter-spacing:8px; font-size:20px; background:var(--bg-card); border:1px solid var(--line); border-radius:10px; padding:14px; margin:18px 0; }
  .admin-tabs{ display:flex; gap:6px; margin-bottom:20px; overflow-x:auto; }
  .admin-tabs button{ flex:0 0 auto; padding:8px 14px; font-size:12px; font-family:'Oswald',sans-serif; letter-spacing:0.5px; background:var(--bg-card); border:1px solid var(--line); border-radius:100px; color:var(--text-dim); }
  .admin-tabs button.active{ background:var(--brass); color:#161310; border-color:var(--brass); font-weight:600; }
  .admin-block{ background:var(--bg-card); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:14px; }
  .admin-block h3{ font-family:'Oswald', sans-serif; font-size:13px; letter-spacing:0.5px; margin-bottom:12px; color:var(--text-dim); text-transform:uppercase; }
  .admin-day-group{ font-size:12px; color:var(--text-dim); margin:18px 0 8px; font-family:'Oswald', sans-serif; letter-spacing:0.5px; }
  .admin-row{ display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid var(--line); gap:10px; }
  .admin-row:last-child{ border-bottom:none; }
  .admin-row .info{ font-size:13px; }
  .admin-row .info .name{ font-weight:600; }
  .admin-row .info .meta{ color:var(--text-dim); font-size:11.5px; margin-top:2px; }
  .admin-row .price{ font-family:'Oswald', sans-serif; color:var(--brass-bright); font-size:14px; white-space:nowrap; }
  .mini-btn{ font-size:11px; color:var(--pinstripe); border:1px solid var(--pinstripe); border-radius:7px; padding:5px 9px; white-space:nowrap; }
  .svc-edit-row{ display:grid; grid-template-columns:1fr 68px 68px; gap:7px; padding:10px 0; border-bottom:1px solid var(--line); align-items:center; }
  .svc-edit-row input, .svc-edit-row select{ background:var(--bg); border:1px solid var(--line); border-radius:7px; padding:8px; font-size:12px; width:100%; }
  .svc-edit-row .del{ grid-column:1/-1; text-align:right; font-size:10.5px; color:var(--text-faint); margin-top:-2px; }
  .toggle-row{ display:flex; justify-content:space-between; align-items:center; padding:9px 0; font-size:13px; border-bottom:1px solid var(--line); }
  .toggle-row:last-child{ border:none; }
  .chk{ width:17px; height:17px; accent-color:var(--brass); }
  .hrs-row{ display:flex; gap:10px; }
  .hrs-row .field{ flex:1; margin-bottom:0; }
  .hrs-row input, .hrs-row select{ width:100%; background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:10px; font-size:13px; }
  .loading{ text-align:center; padding:120px 20px; color:var(--text-dim); font-size:13px; }
  .add-row-btn{ width:100%; margin-top:8px; border:1px dashed var(--line-strong); border-radius:9px; padding:10px; font-size:12px; color:var(--text-dim); }

  @media (prefers-reduced-motion: reduce){ *{ transition:none !important; animation:none !important; } }
</style>
</head>
<body>
<div id="app" class="shell"><div class="loading">Carregando agenda…</div></div>

<script>
/* ============ DEFAULT CONFIG ============ */
const DEFAULT_CONFIG = {
  shopName: "Los Port's Customs",
  pin: "1234",
  hours: { start: "08:00", end: "18:00", slot: 30, daysOff: [0] }, // 0=domingo
  services: [
    { id:'s1', name:'Lavagem Simples', vehicle:'carro', duration:40, price:40 },
    { id:'s2', name:'Lavagem Completa', vehicle:'carro', duration:90, price:70 },
    { id:'s3', name:'Higienização Interna', vehicle:'carro', duration:150, price:150 },
    { id:'s4', name:'Pelo do Carneiro', vehicle:'carro', duration:90, price:120, highlight:true },
    { id:'s5', name:'Cristalização de Pintura', vehicle:'carro', duration:180, price:250 },
    { id:'s6', name:'Lavagem Simples', vehicle:'moto', duration:30, price:30 },
    { id:'s7', name:'Lavagem Completa', vehicle:'moto', duration:60, price:50 },
    { id:'s8', name:'Pelo do Carneiro', vehicle:'moto', duration:60, price:80, highlight:true }
  ]
};

let CONFIG = null;
let BOOKINGS = [];
let adminUnlocked = false;

const state = {
  view:'booking', // booking | admin
  step:1,
  vehicleFilter:'carro',
  service:null,
  date:null,
  time:null,
  adminTab:'agenda',
  pinInput:'',
  pinError:false
};

/* ============ STORAGE ============ */
async function hasStorage(){ return typeof window.storage !== 'undefined'; }

async function loadConfig(){
  try{
    if(await hasStorage()){
      const res = await window.storage.get('config', true);
      CONFIG = (res && res.value) ? JSON.parse(res.value) : null;
    }
  }catch(e){ CONFIG = null; }
  if(!CONFIG){
    CONFIG = JSON.parse(JSON.stringify(DEFAULT_CONFIG));
    await saveConfig();
  }
}
async function saveConfig(){
  try{ if(await hasStorage()) await window.storage.set('config', JSON.stringify(CONFIG), true); }catch(e){ console.error('saveConfig failed', e); }
}
async function loadBookings(){
  try{
    if(await hasStorage()){
      const res = await window.storage.get('bookings', true);
      BOOKINGS = (res && res.value) ? JSON.parse(res.value) : [];
    } else { BOOKINGS = []; }
  }catch(e){ BOOKINGS = []; }
}
async function saveBookings(){
  try{ if(await hasStorage()) await window.storage.set('bookings', JSON.stringify(BOOKINGS), true); }catch(e){ console.error('saveBookings failed', e); }
}

/* ============ HELPERS ============ */
function pad(n){ return n.toString().padStart(2,'0'); }
function timeToMin(t){ const [h,m]=t.split(':').map(Number); return h*60+m; }
function minToTime(m){ return pad(Math.floor(m/60))+':'+pad(((m%60)+60)%60); }
function fmtDateISO(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function money(v){ return 'R$ ' + v.toFixed(2).replace('.', ','); }
const WEEKDAYS=['DOM','SEG','TER','QUA','QUI','SEX','SÁB'];
const MONTHS=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
function fmtDateLong(iso){
  const d = new Date(iso+'T00:00:00');
  return WEEKDAYS[d.getDay()]+', '+d.getDate()+' '+MONTHS[d.getMonth()];
}
function nextDays(n){
  const arr=[]; const today=new Date();
  for(let i=0;i<n;i++){ const d=new Date(today); d.setDate(d.getDate()+i); arr.push(d); }
  return arr;
}
function isShopOpenNow(){
  const now = new Date();
  if(CONFIG.hours.daysOff.includes(now.getDay())) return false;
  const cur = now.getHours()*60+now.getMinutes();
  return cur >= timeToMin(CONFIG.hours.start) && cur < timeToMin(CONFIG.hours.end);
}
function getAvailableSlots(dateISO, service){
  const dow = new Date(dateISO+'T00:00:00').getDay();
  if(CONFIG.hours.daysOff.includes(dow)) return [];
  const open = timeToMin(CONFIG.hours.start);
  const close = timeToMin(CONFIG.hours.end);
  const interval = CONFIG.hours.slot || 30;
  const dur = service.duration;
  const dayBookings = BOOKINGS.filter(b=>b.date===dateISO);
  const now = new Date();
  const isToday = dateISO === fmtDateISO(now);
  const nowMin = now.getHours()*60+now.getMinutes()+30;
  const slots=[];
  for(let t=open; t+dur<=close; t+=interval){
    if(isToday && t <= nowMin) continue;
    const conflict = dayBookings.some(b=>{
      const bs=timeToMin(b.time), be=bs+b.duration;
      return t < be && (t+dur) > bs;
    });
    if(!conflict) slots.push(t);
  }
  return slots.map(minToTime);
}
function generateCode(){ return 'LPC'+Date.now().toString(36).toUpperCase().slice(-5); }
function svcById(id){ return CONFIG.services.find(s=>s.id===id); }

function resetBookingFlow(){
  state.view='booking'; state.step=1; state.service=null; state.date=null; state.time=null; state.lastBooking=null;
}

/* ============ RENDER: SHARED HEADER ============ */
function eagleSVG(){
  return '<svg class="eagle" viewBox="0 0 100 70" aria-hidden="true">'+
    '<path d="M50 40 C 40 20, 15 12, 2 16 C 14 22, 22 28, 28 36 C 18 34, 8 36, 2 42 C 14 40, 24 42, 32 48 L 44 40 Z"/>'+
    '<path d="M50 40 C 60 20, 85 12, 98 16 C 86 22, 78 28, 72 36 C 82 34, 92 36, 98 42 C 86 40, 76 42, 68 48 L 56 40 Z"/>'+
    '<path d="M50 38 C 47 44, 47 52, 50 60 C 53 52, 53 44, 50 38 Z"/>'+
    '<circle cx="50" cy="30" r="4.2"/>'+
    '</svg>';
}
function badgeHeader(){
  const open = isShopOpenNow();
  return '<div class="badge-header">'+
    eagleSVG()+
    '<div class="brand-script">Los Port\'s</div>'+
    '<div class="brand-block">CUSTOMS</div>'+
    '<div class="brand-tagline">Estética Automotiva</div>'+
    '<div class="brand-divider"><span class="ln"></span><span class="star">★</span><span class="ln"></span></div>'+
    '<div class="status-row"><span class="status-dot '+(open?'open':'')+'"></span>'+(open?'Aberto agora':'Fechado no momento')+'</div>'+
    '</div>';
}

/* ============ RENDER: BOOKING FLOW ============ */
function stepper(){
  const labels=['Serviço','Data','Horário','Dados'];
  let html='<div class="stepper">';
  labels.forEach((l,i)=>{
    const n=i+1;
    let cls='step-tab';
    if(n===state.step) cls+=' active'; else if(n<state.step) cls+=' done';
    html+='<div class="'+cls+'">'+n+' · '+l+'</div>';
  });
  html+='</div>';
  return html;
}
function backLink(){
  if(state.step<=1) return '';
  return '<div class="back-link" onclick="goBack()">‹ Voltar</div>';
}

function renderStep1(){
  const services = CONFIG.services.filter(s=>s.vehicle===state.vehicleFilter);
  let cards = services.map(s=>{
    return '<div class="service-card '+(s.highlight?'highlight':'')+'" onclick="selectService(\''+s.id+'\')">'+
      '<div><div class="service-name-row"><span class="service-name">'+s.name+'</span>'+(s.highlight?'<span class="service-badge">Especialidade</span>':'')+'</div>'+
      '<div class="service-meta">'+durationLabel(s.duration)+'</div></div>'+
      '<div class="service-price">'+money(s.price)+'</div>'+
      '</div>';
  }).join('');
  if(services.length===0) cards='<div class="empty-note">Nenhum serviço cadastrado para este veículo ainda.</div>';
  return '<div class="section-title">Escolha o serviço</div>'+
    '<div class="section-sub">Selecione o tipo de veículo e o serviço desejado</div>'+
    '<div class="veh-toggle">'+
      '<button class="'+(state.vehicleFilter==='carro'?'active':'')+'" onclick="setVehicle(\'carro\')">Carro</button>'+
      '<button class="'+(state.vehicleFilter==='moto'?'active':'')+'" onclick="setVehicle(\'moto\')">Moto</button>'+
    '</div>'+cards;
}
function durationLabel(min){
  if(min<60) return min+' min';
  const h=Math.floor(min/60), m=min%60;
  return h+'h'+(m?pad(m):'');
}

function renderStep2(){
  const days = nextDays(16);
  let chips = days.map(d=>{
    const iso=fmtDateISO(d);
    const closed = CONFIG.hours.daysOff.includes(d.getDay());
    let cls='date-chip'+(state.date===iso?' active':'')+(closed?' closed':'');
    return '<div class="'+cls+'" onclick="'+(closed?'':'selectDate(\''+iso+'\')')+'">'+
      '<div class="dow">'+WEEKDAYS[d.getDay()]+'</div>'+
      '<div class="num">'+d.getDate()+'</div>'+
      '<div class="mon">'+MONTHS[d.getMonth()]+'</div>'+
      '</div>';
  }).join('');
  return backLink()+
    '<div class="section-title">Escolha a data</div>'+
    '<div class="section-sub">'+state.service.name+' · '+durationLabel(state.service.duration)+'</div>'+
    '<div class="date-strip">'+chips+'</div>';
}

function renderStep3(){
  const slots = getAvailableSlots(state.date, state.service);
  let grid;
  if(slots.length===0){
    grid='<div class="empty-note">Sem horários disponíveis neste dia. Escolha outra data.</div>';
  } else {
    grid='<div class="time-grid">'+slots.map(t=>{
      return '<div class="time-chip '+(state.time===t?'active':'')+'" onclick="selectTime(\''+t+'\')">'+t+'</div>';
    }).join('')+'</div>';
  }
  return backLink()+
    '<div class="section-title">Escolha o horário</div>'+
    '<div class="section-sub">'+fmtDateLong(state.date)+'</div>'+
    grid;
}

function renderStep4(){
  return backLink()+
    '<div class="section-title">Seus dados</div>'+
    '<div class="section-sub">Confirme os detalhes e finalize sua reserva</div>'+
    '<div class="summary-box">'+
      '<div class="summary-row"><span class="k">Serviço</span><span class="v">'+state.service.name+'</span></div>'+
      '<div class="summary-row"><span class="k">Data</span><span class="v">'+fmtDateLong(state.date)+'</span></div>'+
      '<div class="summary-row"><span class="k">Horário</span><span class="v">'+state.time+'</span></div>'+
      '<div class="summary-row"><span class="k">Duração</span><span class="v">'+durationLabel(state.service.duration)+'</span></div>'+
      '<div class="summary-row total"><span class="k">Total</span><span class="v">'+money(state.service.price)+'</span></div>'+
    '</div>'+
    '<div class="field"><label>Nome</label><input id="f-name" type="text" placeholder="Seu nome completo"></div>'+
    '<div class="field"><label>WhatsApp</label><input id="f-phone" type="tel" placeholder="(15) 99999-9999"></div>'+
    '<div class="field"><label>Veículo (modelo / placa)</label><input id="f-vehicle" type="text" placeholder="Ex: Corolla prata · ABC1D23"></div>'+
    '<div id="form-error" style="color:var(--pinstripe); font-size:12px; margin-bottom:6px; display:none;">Preencha nome e WhatsApp para continuar.</div>'+
    '<button class="btn-primary" onclick="confirmBooking()">Confirmar agendamento</button>';
}

function renderTicket(){
  const b = state.lastBooking;
  return '<div class="ticket-wrap">'+
    '<div class="ticket">'+
      '<div class="stamp">CONFIRMADO</div>'+
      '<div class="ticket-top">'+
        '<div class="ticket-code">Nº '+b.code+'</div>'+
        '<div class="ticket-service">'+b.serviceName+'</div>'+
      '</div>'+
      '<div class="ticket-dash"></div>'+
      '<div class="ticket-row"><span class="k">Data</span><span class="v">'+fmtDateLong(b.date)+'</span></div>'+
      '<div class="ticket-row"><span class="k">Horário</span><span class="v">'+b.time+'</span></div>'+
      '<div class="ticket-row"><span class="k">Veículo</span><span class="v">'+(b.vehicle||'—')+'</span></div>'+
      '<div class="ticket-row"><span class="k">Cliente</span><span class="v">'+b.name+'</span></div>'+
      '<div class="ticket-row"><span class="k">WhatsApp</span><span class="v">'+b.phone+'</span></div>'+
      '<div class="ticket-dash"></div>'+
      '<div class="ticket-price"><div class="amt">'+money(b.price)+'</div></div>'+
      '<div class="ticket-note">Apresente este número na chegada.<br>Chegue com 10 minutos de antecedência.</div>'+
    '</div>'+
    '</div>'+
    '<button class="btn-ghost" onclick="resetBookingFlow(); render();">Fazer nova reserva</button>';
}

function renderBookingView(){
  let body='';
  if(state.step===1) body=renderStep1();
  else if(state.step===2) body=renderStep2();
  else if(state.step===3) body=renderStep3();
  else if(state.step===4) body=renderStep4();
  const showStepper = !state.lastBooking;
  return badgeHeader()+
    (showStepper?stepper():'')+
    '<div class="content">'+(state.lastBooking?renderTicket():body)+'</div>'+
    '<div class="foot">'+
      '<div class="ig">@losportos_customs</div>'+
      '<div class="admin-link" onclick="openAdmin()">Área da loja</div>'+
    '</div>';
}

/* ============ RENDER: ADMIN ============ */
function renderAdminGate(){
  return '<div class="admin-shell">'+
    '<div class="admin-head"><h1>Área da loja</h1><span class="admin-exit" onclick="exitAdmin()">Fechar</span></div>'+
    '<div class="pin-box">'+
      '<div class="section-sub">Digite o PIN de acesso</div>'+
      '<input id="pin-field" type="password" inputmode="numeric" maxlength="4" placeholder="••••" autofocus>'+
      (state.pinError?'<div style="color:var(--pinstripe); font-size:12px; margin-bottom:10px;">PIN incorreto.</div>':'')+
      '<button class="btn-primary" onclick="checkPin()">Entrar</button>'+
    '</div>'+
    '</div>';
}

function renderAdminAgenda(){
  const sorted = [...BOOKINGS].sort((a,b)=> (a.date+a.time).localeCompare(b.date+b.time));
  if(sorted.length===0) return '<div class="empty-note">Nenhum agendamento ainda.</div>';
  let groups={};
  sorted.forEach(b=>{ (groups[b.date]=groups[b.date]||[]).push(b); });
  let html='';
  Object.keys(groups).forEach(date=>{
    html+='<div class="admin-day-group">'+fmtDateLong(date)+'</div>';
    html+='<div class="admin-block">'+groups[date].map(b=>{
      return '<div class="admin-row"><div class="info"><div class="name">'+b.time+' · '+b.serviceName+'</div>'+
        '<div class="meta">'+b.name+' · '+b.phone+(b.vehicle?' · '+b.vehicle:'')+'</div></div>'+
        '<div style="display:flex; align-items:center; gap:8px;"><span class="price">'+money(b.price)+'</span>'+
        '<span class="mini-btn" onclick="cancelBooking(\''+b.id+'\')">Cancelar</span></div></div>';
    }).join('')+'</div>';
  });
  return html;
}

function renderAdminServices(){
  const rows = CONFIG.services.map((s,i)=>{
    return '<div class="svc-edit-row" data-idx="'+i+'">'+
      '<input type="text" value="'+s.name.replace(/"/g,'&quot;')+'" data-field="name">'+
      '<select data-field="vehicle">'+
        '<option value="carro" '+(s.vehicle==='carro'?'selected':'')+'>Carro</option>'+
        '<option value="moto" '+(s.vehicle==='moto'?'selected':'')+'>Moto</option>'+
      '</select>'+
      '<input type="number" value="'+s.duration+'" data-field="duration" title="minutos">'+
      '<input type="text" value="'+s.name.replace(/"/g,'&quot;')+'" style="display:none">'+
      '<input type="number" value="'+s.price+'" data-field="price" style="grid-column:1/2;" title="preço">'+
      '<select data-field="highlight" style="grid-column:2/3;"><option value="0" '+(!s.highlight?'selected':'')+'>Normal</option><option value="1" '+(s.highlight?'selected':'')+'>Destaque</option></select>'+
      '<div class="del" onclick="removeService('+i+')">remover ✕</div>'+
      '</div>';
  }).join('');
  return '<div class="admin-block"><h3>Serviços cadastrados</h3>'+rows+
    '<div class="add-row-btn" onclick="addService()">+ adicionar serviço</div></div>'+
    '<button class="btn-primary" onclick="saveServicesFromForm()">Salvar serviços</button>';
}

function renderAdminHours(){
  const dayNames=['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
  const toggles = dayNames.map((d,i)=>{
    const off = CONFIG.hours.daysOff.includes(i);
    return '<div class="toggle-row"><span>'+d+'</span><input type="checkbox" class="chk" id="day-'+i+'" '+(off?'':'checked')+'></div>';
  }).join('');
  return '<div class="admin-block"><h3>Horário de funcionamento</h3>'+
    '<div class="hrs-row"><div class="field"><label>Abre</label><input id="hr-start" type="time" value="'+CONFIG.hours.start+'"></div>'+
    '<div class="field"><label>Fecha</label><input id="hr-end" type="time" value="'+CONFIG.hours.end+'"></div></div>'+
    '<div class="field" style="margin-top:14px;"><label>Intervalo entre horários</label><select id="hr-slot">'+
      [15,30,60].map(v=>'<option value="'+v+'" '+(CONFIG.hours.slot===v?'selected':'')+'>'+v+' min</option>').join('')+
    '</select></div></div>'+
    '<div class="admin-block"><h3>Dias abertos</h3>'+toggles+'</div>'+
    '<button class="btn-primary" onclick="saveHoursFromForm()">Salvar horários</button>';
}

function renderAdminSecurity(){
  return '<div class="admin-block"><h3>PIN de acesso</h3>'+
    '<div class="field"><label>Novo PIN (4 dígitos)</label><input id="new-pin" type="password" inputmode="numeric" maxlength="4" placeholder="'+CONFIG.pin+'"></div>'+
    '</div><button class="btn-primary" onclick="savePinFromForm()">Salvar PIN</button>';
}

function renderAdminView(){
  if(!adminUnlocked) return renderAdminGate();
  const tabs=[['agenda','Agenda'],['servicos','Serviços'],['horarios','Horários'],['seguranca','Segurança']];
  let tabBtns = tabs.map(t=>'<button class="'+(state.adminTab===t[0]?'active':'')+'" onclick="setAdminTab(\''+t[0]+'\')">'+t[1]+'</button>').join('');
  let body='';
  if(state.adminTab==='agenda') body=renderAdminAgenda();
  else if(state.adminTab==='servicos') body=renderAdminServices();
  else if(state.adminTab==='horarios') body=renderAdminHours();
  else body=renderAdminSecurity();
  return '<div class="admin-shell">'+
    '<div class="admin-head"><h1>Área da loja</h1><span class="admin-exit" onclick="exitAdmin()">Fechar</span></div>'+
    '<div class="admin-tabs">'+tabBtns+'</div>'+
    body+
    '</div>';
}

/* ============ MASTER RENDER ============ */
function render(){
  const app=document.getElementById('app');
  app.innerHTML = state.view==='admin' ? renderAdminView() : renderBookingView();
}

/* ============ ACTIONS: BOOKING ============ */
function setVehicle(v){ state.vehicleFilter=v; render(); }
function selectService(id){ state.service=svcById(id); state.step=2; state.date=null; state.time=null; render(); }
function selectDate(iso){ state.date=iso; state.time=null; state.step=3; render(); }
function selectTime(t){ state.time=t; state.step=4; render(); }
function goBack(){ state.step=Math.max(1,state.step-1); render(); }

async function confirmBooking(){
  const name=document.getElementById('f-name').value.trim();
  const phone=document.getElementById('f-phone').value.trim();
  const vehicle=document.getElementById('f-vehicle').value.trim();
  if(!name || !phone){
    document.getElementById('form-error').style.display='block';
    return;
  }
  const booking = {
    id: 'b'+Date.now(),
    code: generateCode(),
    serviceId: state.service.id,
    serviceName: state.service.name,
    duration: state.service.duration,
    price: state.service.price,
    date: state.date,
    time: state.time,
    name, phone, vehicle,
    createdAt: new Date().toISOString()
  };
  BOOKINGS.push(booking);
  await saveBookings();
  state.lastBooking = booking;
  render();
}

/* ============ ACTIONS: ADMIN ============ */
function openAdmin(){ state.view='admin'; adminUnlocked=false; state.pinError=false; state.adminTab='agenda'; render(); }
function exitAdmin(){ state.view='booking'; render(); }
function checkPin(){
  const val = document.getElementById('pin-field').value.trim();
  if(val === CONFIG.pin){ adminUnlocked=true; state.pinError=false; }
  else { state.pinError=true; }
  render();
}
function setAdminTab(t){ state.adminTab=t; render(); }

async function cancelBooking(id){
  if(!confirm('Cancelar este agendamento?')) return;
  BOOKINGS = BOOKINGS.filter(b=>b.id!==id);
  await saveBookings();
  render();
}

function addService(){
  CONFIG.services.push({ id:'s'+Date.now(), name:'Novo serviço', vehicle:'carro', duration:60, price:0, highlight:false });
  render();
}
function removeService(idx){
  if(!confirm('Remover este serviço?')) return;
  CONFIG.services.splice(idx,1);
  saveConfig();
  render();
}
async function saveServicesFromForm(){
  const rows = document.querySelectorAll('.svc-edit-row');
  const updated=[];
  rows.forEach(row=>{
    const idx = row.getAttribute('data-idx');
    const existing = CONFIG.services[idx];
    const name = row.querySelector('[data-field="name"]').value.trim() || 'Serviço';
    const vehicle = row.querySelector('[data-field="vehicle"]').value;
    const duration = parseInt(row.querySelector('[data-field="duration"]').value) || 30;
    const price = parseFloat(row.querySelector('[data-field="price"]').value) || 0;
    const highlight = row.querySelector('[data-field="highlight"]').value === '1';
    updated.push({ id: existing.id, name, vehicle, duration, price, highlight });
  });
  CONFIG.services = updated;
  await saveConfig();
  render();
}
async function saveHoursFromForm(){
  const start = document.getElementById('hr-start').value || CONFIG.hours.start;
  const end = document.getElementById('hr-end').value || CONFIG.hours.end;
  const slot = parseInt(document.getElementById('hr-slot').value) || 30;
  const daysOff=[];
  for(let i=0;i<7;i++){ if(!document.getElementById('day-'+i).checked) daysOff.push(i); }
  CONFIG.hours = { start, end, slot, daysOff };
  await saveConfig();
  render();
}
async function savePinFromForm(){
  const val = document.getElementById('new-pin').value.trim();
  if(val.length===4){ CONFIG.pin = val; await saveConfig(); alert('PIN atualizado.'); }
  render();
}

/* ============ INIT ============ */
async function init(){
  try{
    await loadConfig();
    await loadBookings();
    render();
  }catch(e){
    document.getElementById('app').innerHTML = '<div class="loading">Não foi possível carregar a agenda.<br><br><span style="text-decoration:underline; cursor:pointer;" onclick="init()">Tentar novamente</span></div>';
  }
}
init();
</script>
</body>
</html>
